# Woodpecker CI —— Codeberg 官方托管 CI（ci.codeberg.org）
#
# 这是本项目在 Codeberg 上的**推荐/主用**流水线；Codeberg 官方文档也建议需要
# 托管 CI 的仓库优先使用 Woodpecker。启用步骤：
#   1. 向 Codeberg 申请 Woodpecker CI 访问权限（Codeberg-e.V./requests 里的
#      Woodpecker CI 表单）；
#   2. 登录 https://ci.codeberg.org → 添加/激活本仓库；
#   3. 只有“自动创建 Release”需要：仓库 Secrets 新增
#        release_token = <Codeberg 访问令牌，权限含 write:repository>
#      （Codeberg → Settings → Applications → Generate new token）。
#
# 行为：
#   - push / pull_request：只跑构建、单元测试、静态检查（省资源）；
#   - push tag / 手动 Pipeline：再交叉编译 7 类 ABI 架构、打 .ipk/.apk、LuCI
#     包、桌面 .deb，最后调用 scripts/publish-release.sh 创建/更新 Codeberg Release。
#
# 如果同时启用了 `.forgejo/workflows`（Forgejo Actions），请只保留一套，避免重复
# 构建和并发发布。
when:
  - event: [ push, pull_request, tag, manual ]

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      tags: true

steps:
  # ---------- 1) 构建 + 单元测试 + 静态检查 ----------
  - name: build-test
    image: rust:1-bookworm
    commands:
      - apt-get update
      - apt-get install -y --no-install-recommends git ca-certificates curl python3 nodejs python3-yaml
      - cargo build --release --locked
      - cargo test --locked
      - ./scripts/ci-checks.sh

  # ---------- 2) 版本号（仅发布事件）----------
  - name: version
    image: rust:1-bookworm
    depends_on: [ build-test ]
    when:
      - event: [ tag, manual ]
    environment:
      AUTHEAP_NO_VERSION_BUMP: "1"
      RELEASE_TOKEN:
        from_secret: release_token
    commands:
      - apt-get update
      - apt-get install -y --no-install-recommends git ca-certificates curl
      - ./scripts/ci-version.sh > .ci-version
      - echo "本次版本号：$(cat .ci-version)"

  # ---------- 3) 7 类 ABI 架构：交叉编译 + 打 .ipk/.apk（仅发布事件）----------
  # 同一 workspace 串行执行，产物保留给后面的 LuCI/Release 步骤。
  - name: openwrt-packages
    image: rust:1-bookworm
    depends_on: [ version ]
    when:
      - event: [ tag, manual ]
    environment:
      CI_SKIP_PUBLISH: "1"
      AUTHEAP_NO_VERSION_BUMP: "1"
    commands:
      - apt-get update
      - apt-get install -y --no-install-recommends git ca-certificates curl file \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf gcc-riscv64-linux-gnu
      - rustup component add rust-src
      - |
        set -eu
        # 每个 ABI 代表性 OpenWrt 架构；更多同 ABI 的架构可复制对应条目：
        #   aarch64: aarch64_cortex-a53 / aarch64_cortex-a72 / aarch64_generic
        #   armv7:   arm_cortex-a7_neon-vfpv4 / arm_cortex-a9_vfpv3-d16
        #   mipsel:  mipsel_24kc / mipsel_74kc
        for target in \
          "x86_64-unknown-linux-musl x86_64 x86_64" \
          "aarch64-unknown-linux-musl aarch64_cortex-a53 aarch64_cortex-a53" \
          "armv7-unknown-linux-musleabihf arm_cortex-a7_neon-vfpv4 arm_cortex-a7_neon-vfpv4" \
          "arm-unknown-linux-musleabihf arm_arm1176jzf-s_vfp arm_arm1176jzf-s_vfp" \
          "riscv64gc-unknown-linux-musl riscv64_riscv64 riscv64_riscv64" \
          "mipsel-unknown-linux-musl mipsel_24kc mipsel_24kc" \
          "mips-unknown-linux-musl mips_24kc mips_24kc"; do
          set -- $target
          echo "=== 交叉编译与打包: $1（ipk=$2 apk=$3）"
          ./scripts/ci-build-package.sh "$1" "$2" "$3"
        done
      - ls -l packaging/openwrt/staging/

  # ---------- 4) LuCI 包 + 桌面 deb + 发布（仅发布事件）----------
  - name: luci-desktop-and-release
    image: rust:1-bookworm
    depends_on: [ openwrt-packages ]
    when:
      - event: [ tag, manual ]
    environment:
      AUTHEAP_NO_VERSION_BUMP: "1"
      RELEASE_TOKEN:
        from_secret: release_token
    commands:
      - apt-get update
      - apt-get install -y --no-install-recommends git ca-certificates curl dpkg-dev
      - |
        set -eu
        V="$(cat .ci-version)"
        ./packaging/openwrt/scripts/build-luci.sh "$V" 1
        VERSION="$V" ./packaging/desktop/build-deb.sh
        ls -l packaging/openwrt/staging/ packaging/desktop/out/
      - |
        set -eu
        V="$(cat .ci-version)"
        case "${CI_PIPELINE_EVENT:-}" in
          tag|release|manual) ;;
          *)
            [ -n "${CI_COMMIT_TAG:-}" ] || {
              echo "[*] 事件 ${CI_PIPELINE_EVENT:-unknown}：不发布"
              exit 0
            }
            ;;
        esac
        [ -n "${RELEASE_TOKEN:-}" ] || {
          echo "[!] 未配置 secret release_token，无法发布 Release" >&2
          exit 1
        }
        echo "=== 发布 Release $V"
        ./scripts/publish-release.sh "$V" "$V" \
          packaging/openwrt/staging/*.ipk \
          packaging/openwrt/staging/*.apk \
          packaging/desktop/out/*.deb
