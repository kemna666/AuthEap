# Woodpecker CI —— 用于 **Codeberg**（ci.codeberg.org）
#
# 为什么要用这个文件：
#   Codeberg 不托管 Forgejo Actions（所以仓库里的 `.forgejo/workflows/*` 在 Codeberg
#   上永远不会被执行），Codeberg 官方提供的是 **Woodpecker CI**。把这个文件放在仓库根
#   目录并在 Woodpecker 里激活仓库，CI/CD 就能跑起来。
#
# 启用步骤：
#   1. 提交本文件到 main（git push）；
#   2. 打开 https://ci.codeberg.org → 用 Codeberg 账号登录 → 找到本仓库 → Activate；
#   3. （可选，只有“自动创建 Release”需要）仓库设置 → Secrets → 新增：
#        名称: release_token   值: <Codeberg 访问令牌，权限需含 write:repository>
#      令牌在 Codeberg → Settings → Applications → Generate new token 里创建。
#
# 行为：
#   - push / PR：构建 + 单测 + 脚本静态检查 + 交叉编译 OpenWrt 包（只构建，不发布）；
#   - 推送 tag（例如 0.1.17）或手动触发（Manual Pipeline）：
#     版本号由 `scripts/ci-version.sh` 决定（tag 用 tag 名；手动触发取同版本线远端最大 +1），
#     打包完成后调用 `scripts/publish-release.sh` 创建/更新 Release 并上传全部产物。
#
# 相关脚本（与 .github/.forgejo 流水线共用同一套）：
#   scripts/ci-version.sh         计算版本号
#   scripts/ci-checks.sh          shell/JSON/JS 静态检查
#   scripts/ci-build-package.sh   交叉编译 + 打 ipk/apk（可选发布）
#   scripts/publish-release.sh    上传 Release 附件（幂等）
#   scripts/bump-version.sh       版本号递增

when:
  - event: [ push, pull_request, tag, manual ]

# 拉取 tag（便于 ci-version.sh 在没有 API 权限时用本地 tag 兜底）
clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      tags: true

steps:
  # ---------- 1) 构建 + 单元测试 + 静态检查 ----------
  - name: build-test
    image: rust:1-bookworm
    commands:
      - apt-get update
      - apt-get install -y --no-install-recommends git ca-certificates curl python3
      - cargo build --release --locked
      - cargo test --locked
      - ./scripts/ci-checks.sh

  # ---------- 2) 计算版本号（写入 .ci-version，后续步骤共用）----------
  - name: version
    image: rust:1-bookworm
    depends_on: [ build-test ]
    environment:
      RELEASE_TOKEN:
        from_secret: release_token
    commands:
      - apt-get update
      - apt-get install -y --no-install-recommends git ca-certificates curl
      - ./scripts/ci-version.sh > .ci-version
      - echo "本次版本号：$(cat .ci-version)"

  # ---------- 3) 三种 musl 目标：交叉编译 + 打 .ipk/.apk ----------
  # 串行执行（同一 workspace 里依次产出，避免并发抢 Release；小项目足够快）
  - name: openwrt-packages
    image: rust:1-bookworm
    depends_on: [ version ]
    environment:
      CI_SKIP_PUBLISH: "1"          # 发布统一放到最后一步，避免并发创建 Release
    commands:
      - apt-get update
      - apt-get install -y --no-install-recommends git ca-certificates curl file gcc-aarch64-linux-gnu
      - rustup component add rust-src
      - |
        set -e
        for target in \
          "x86_64-unknown-linux-musl x86_64 x86_64" \
          "aarch64-unknown-linux-musl aarch64_cortex-a53 aarch64_cortex-a53" \
          "mipsel-unknown-linux-musl mipsel_24kc mipsel_24kc"; do
          set -- $target
          echo "=== 交叉编译与打包: $1（ipk=$2 apk=$3）"
          ./scripts/ci-build-package.sh "$1" "$2" "$3"
        done
      - ls -l packaging/openwrt/staging/

  # ---------- 4) LuCI 界面包 + 桌面 .deb，并在发布事件下上传 Release ----------
  - name: luci-desktop-and-release
    image: rust:1-bookworm
    depends_on: [ openwrt-packages ]
    environment:
      RELEASE_TOKEN:
        from_secret: release_token
    commands:
      - apt-get update
      - apt-get install -y --no-install-recommends git ca-certificates curl dpkg-dev python3
      - V="$(cat .ci-version)"
      - ./packaging/openwrt/scripts/build-luci.sh "$V" 1
      - VERSION="$V" ./packaging/desktop/build-deb.sh
      - ls -l packaging/openwrt/staging/ packaging/desktop/out/
      - |
        set -e
        V="$(cat .ci-version)"
        case "${CI_PIPELINE_EVENT:-}" in
          tag|release|manual)
            if [ -n "${RELEASE_TOKEN:-}" ]; then
              echo "=== 发布 Release $V"
              ./scripts/publish-release.sh "$V" "$V" \
                packaging/openwrt/staging/*.ipk \
                packaging/openwrt/staging/*.apk \
                packaging/desktop/out/*.deb
            else
              echo "[!] 未配置 secret release_token：跳过发布（artifacts 仍在 agent 上）"
            fi
            ;;
          *)
            echo "[*] 事件 ${CI_PIPELINE_EVENT:-unknown}：仅构建，不发布"
            ;;
        esac
