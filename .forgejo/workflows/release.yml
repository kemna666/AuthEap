# Forgejo Actions —— 发布流水线（**可直接在 Codeberg 的托管 runner 上运行**）
#
# 启用前提（同 ci.yml）：仓库 Settings → Units → 勾选 “Enable Actions”；
# 并添加仓库 Secret `RELEASE_TOKEN`（Codeberg 访问令牌，权限需含 write:repository）。
#
# runs-on 用 Codeberg 托管 runner 标签：codeberg-tiny(2min) / codeberg-small(5min) /
# codeberg-medium(10min)，均可加 `-lazy` 后缀。托管 runner 不支持 Docker daemon，
# 因此不写 `container:`，改用 rustup 装工具链（自建 runner 请把 runs-on 换成自己的 label）。
#
# 触发：
#   - 推送 tag（如 0.1.17）：以 tag 作为版本号并发布；
#   - 手动触发（workflow_dispatch）：版本号对远端最大版本自动 +1 后发布
#     —— 即“每发布一个版本依次递增”，无需手工改 Cargo.toml。
name: Release

on:
  push:
    tags: [ '*.*.*' ]
  workflow_dispatch:
    inputs:
      bump:
        description: '版本号递增级别（patch / minor / major）'
        default: patch

jobs:
  # ---------- 计算版本号（整条流水线共用）----------
  version:
    runs-on: codeberg-tiny
    outputs:
      version: ${{ steps.calc.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: 计算版本号
        id: calc
        env:
          BUMP_LEVEL: ${{ inputs.bump }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          V="$(./scripts/ci-version.sh)"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "本次版本号: $V"

  # ---------- 交叉编译 + 打包 + 上传 Release 附件 ----------
  openwrt:
    runs-on: codeberg-medium
    needs: [ version ]
    strategy:
      fail-fast: false
      max-parallel: 1          # 串行，避免并发创建同一个 Release
      matrix:
        include:
          - triple: x86_64-unknown-linux-musl
            ipk_arch: x86_64
            apk_arch: x86_64
          - triple: aarch64-unknown-linux-musl
            ipk_arch: aarch64_cortex-a53
            apk_arch: aarch64_cortex-a53
          - triple: mipsel-unknown-linux-musl
            ipk_arch: mipsel_24kc
            apk_arch: mipsel_24kc
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust（含 rust-src）
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable --component rust-src
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: 安装交叉编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends file curl
          if [ "${{ matrix.triple }}" = "aarch64-unknown-linux-musl" ]; then
            sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu
          fi

      - name: 交叉编译 + 打包 + 发布
        env:
          VERSION: ${{ needs.version.outputs.version }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          ./scripts/ci-build-package.sh \
            "${{ matrix.triple }}" "${{ matrix.ipk_arch }}" "${{ matrix.apk_arch }}"

  # ---------- LuCI 界面包 + 桌面 deb ----------
  luci-desktop:
    runs-on: codeberg-small
    needs: [ version, openwrt ]
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 与打包工具
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev curl

      - name: 构建 LuCI 包与 .deb
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ./packaging/openwrt/scripts/build-luci.sh "$VERSION" 1
          VERSION="$VERSION" ./packaging/desktop/build-deb.sh

      - name: 发布到 Release
        env:
          VERSION: ${{ needs.version.outputs.version }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          ./scripts/publish-release.sh "$VERSION" "$VERSION" \
            packaging/openwrt/staging/*.ipk \
            packaging/openwrt/staging/*.apk \
            packaging/desktop/out/*.deb
