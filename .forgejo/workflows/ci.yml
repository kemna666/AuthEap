# Forgejo Actions（自托管 runner 时使用）
#
# 注意：Codeberg **不提供**托管的 Forgejo Actions（见 docs.codeberg.org/ci/actions），
# 想在 Codeberg 上跑 CI/CD 请用仓库根目录的 `.woodpecker.yml`（Woodpecker CI）。
# 本文件适用于自建 Forgejo 实例 / 自托管 runner。
name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  # ---------- 构建 + 单元测试 + 静态检查 ----------
  build-test:
    runs-on: docker
    container:
      image: rust:1-bookworm
    steps:
      - name: 安装基础工具
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates python3 curl

      - uses: actions/checkout@v4

      - name: cargo build --release
        run: cargo build --release --locked

      - name: cargo test
        run: cargo test --locked

      - name: 静态检查（shell / JSON）
        run: ./scripts/ci-checks.sh

  # ---------- 交叉编译 + 打包 .ipk / .apk ----------
  openwrt:
    runs-on: docker
    container:
      image: rust:1-bookworm
    needs: [ build-test ]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - triple: x86_64-unknown-linux-musl
            ipk_arch: x86_64
            apk_arch: x86_64
          - triple: aarch64-unknown-linux-musl
            ipk_arch: aarch64_cortex-a53
            apk_arch: aarch64_cortex-a53
          - triple: mipsel-unknown-linux-musl
            ipk_arch: mipsel_24kc
            apk_arch: mipsel_24kc
    steps:
      - name: 安装交叉编译依赖
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl file
          if [ "${{ matrix.triple }}" = "aarch64-unknown-linux-musl" ]; then
            apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu
          fi
          rustup component add rust-src

      - uses: actions/checkout@v4

      - name: 交叉编译 + 打包
        env:
          CI_SKIP_PUBLISH: "1"
        run: |
          ./scripts/ci-build-package.sh \
            "${{ matrix.triple }}" "${{ matrix.ipk_arch }}" "${{ matrix.apk_arch }}"
          file packaging/openwrt/staging/autheap

      - name: 上传产物
        uses: actions/upload-artifact@v3
        with:
          name: autheap-openwrt-${{ matrix.ipk_arch }}
          path: |
            packaging/openwrt/staging/*.ipk
            packaging/openwrt/staging/*.apk

  # ---------- LuCI 界面包 + 桌面 deb ----------
  luci-desktop:
    runs-on: docker
    container:
      image: rust:1-bookworm
    needs: [ build-test ]
    steps:
      - name: 安装工具
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates dpkg-dev

      - uses: actions/checkout@v4

      - name: 构建 LuCI 包与 .deb
        run: |
          VERSION="$(./scripts/ci-version.sh)"
          ./packaging/openwrt/scripts/build-luci.sh "$VERSION" 1
          VERSION="$VERSION" ./packaging/desktop/build-deb.sh

      - name: 上传 LuCI 包
        uses: actions/upload-artifact@v3
        with:
          name: autheap-luci
          path: |
            packaging/openwrt/staging/luci-app-autheap-client_*.ipk
            packaging/openwrt/staging/luci-app-autheap-client-*.apk

      - name: 上传桌面 deb
        uses: actions/upload-artifact@v3
        with:
          name: autheap-desktop-deb
          path: packaging/desktop/out/*.deb
