# Forgejo Actions —— CI
#
# 适用场景：
#   * 自建 Forgejo 实例 + 自托管 runner（推荐，无 Codeberg 的 10 分钟单 job 限制）；
#   * Codeberg 的 Forgejo Actions 托管 alpha（Settings → Units → Enable Actions）。
#
# Codeberg 官方对“托管 CI”的推荐是 Woodpecker（见仓库根目录 `.woodpecker.yml`）。
# Codeberg 托管 Forgejo Actions 目前仍有限量：每个 job 2/5/10 分钟，且不支持
# Docker daemon；本文件因此不写 `container:`，而是用 rustup 安装工具链。
#
#   codeberg-tiny    1C/2G   2 分钟
#   codeberg-small   2C/4G   5 分钟
#   codeberg-medium  4C/8G  10 分钟
#   （均可加 `-lazy` 后缀，排队更久但更省资源。）
#
# 触发：push(main/master) / pull_request / 手动。
# 发布走 `.forgejo/workflows/release.yml`；CI 只构建并上传 Actions artifacts。
#
# 产物聚合使用 Forgejo 维护的 artifact action（GitHub 的 actions/upload-artifact@v4
# 在 Forgejo 上不兼容）；自托管旧版 runner 若只看 v3，请把 URL 里的 v4 改成 v3。
name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # CI 的版本由 version job / ci-version.sh 统一决定，构建脚本不要再自动 +1。
  AUTHEAP_NO_VERSION_BUMP: "1"
  RUST_BACKTRACE: 1
  # CI 只构建当前 Cargo.toml 版本，不递增（发布流水线才递增）。
  CI_VERSION_NO_BUMP: "1"

jobs:
  # ---------- 构建 + 单元测试 + 静态检查 ----------
  build-test:
    name: 构建与测试
    runs-on: codeberg-medium
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: 环境信息与静态检查工具
        run: |
          cargo -V
          rustc -V
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nodejs python3-yaml

      - name: cargo build --release
        run: cargo build --release --locked

      - name: cargo test
        run: cargo test --locked

      - name: 静态检查（shell / JSON / JS / YAML）
        run: ./scripts/ci-checks.sh

  # ---------- 交叉编译 + 打包 .ipk / .apk ----------
  # 每个 musl 目标单独一个 job，避免一个超长 job 撞上 10 分钟上限。
  openwrt:
    name: OpenWrt（${{ matrix.ipk_arch }}）
    runs-on: codeberg-medium
    needs: [ build-test ]
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - triple: x86_64-unknown-linux-musl
            ipk_arch: x86_64
            apk_arch: x86_64
            cross_deps: ''
          - triple: aarch64-unknown-linux-musl
            ipk_arch: aarch64_cortex-a53
            apk_arch: aarch64_cortex-a53
            cross_deps: gcc-aarch64-linux-gnu
          - triple: armv7-unknown-linux-musleabihf
            ipk_arch: arm_cortex-a7_neon-vfpv4
            apk_arch: arm_cortex-a7_neon-vfpv4
            cross_deps: gcc-arm-linux-gnueabihf
          - triple: arm-unknown-linux-musleabihf
            ipk_arch: arm_arm1176jzf-s_vfp
            apk_arch: arm_arm1176jzf-s_vfp
            cross_deps: gcc-arm-linux-gnueabihf
          - triple: riscv64gc-unknown-linux-musl
            ipk_arch: riscv64_riscv64
            apk_arch: riscv64_riscv64
            cross_deps: gcc-riscv64-linux-gnu
          - triple: mipsel-unknown-linux-musl
            ipk_arch: mipsel_24kc
            apk_arch: mipsel_24kc
            cross_deps: ''
          - triple: mips-unknown-linux-musl
            ipk_arch: mips_24kc
            apk_arch: mips_24kc
            cross_deps: ''
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust（含 rust-src，用于 -Z build-std）
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable --component rust-src
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: 安装打包/交叉编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends file curl
          DEPS="${{ matrix.cross_deps }}"
          if [ -n "$DEPS" ]; then
            sudo apt-get install -y --no-install-recommends $DEPS
          fi

      - name: 交叉编译 + 打包
        env:
          CI_SKIP_PUBLISH: "1"
        run: |
          ./scripts/ci-build-package.sh \
            "${{ matrix.triple }}" "${{ matrix.ipk_arch }}" "${{ matrix.apk_arch }}"
          file packaging/openwrt/staging/autheap
          ls -l packaging/openwrt/staging/

      - name: 上传 OpenWrt 产物
        uses: https://data.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: autheap-openwrt-${{ matrix.ipk_arch }}
          if-no-files-found: error
          path: |
            packaging/openwrt/staging/*.ipk
            packaging/openwrt/staging/*.apk

  # ---------- LuCI 界面包（纯打包，不编译 Rust）----------
  luci:
    name: LuCI 包
    runs-on: codeberg-tiny
    needs: [ build-test ]
    steps:
      - uses: actions/checkout@v4

      - name: 构建 LuCI .ipk / .apk
        run: |
          VERSION="$(./scripts/ci-version.sh)"
          ./packaging/openwrt/scripts/build-luci.sh "$VERSION" 1

      - name: 上传 LuCI 产物
        uses: https://data.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: autheap-luci
          if-no-files-found: error
          path: |
            packaging/openwrt/staging/luci-app-autheap-client_*.ipk
            packaging/openwrt/staging/luci-app-autheap-client-*.apk

  # ---------- 桌面 Linux .deb ----------
  desktop:
    name: 桌面 deb
    runs-on: codeberg-medium
    needs: [ build-test ]
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 与打包工具
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev

      - name: 构建 .deb
        run: |
          VERSION="$(./scripts/ci-version.sh)"
          VERSION="$VERSION" ./packaging/desktop/build-deb.sh

      - name: 上传桌面 deb
        uses: https://data.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: autheap-desktop-deb
          if-no-files-found: error
          path: packaging/desktop/out/*.deb
