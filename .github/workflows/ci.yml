name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---------- 1) 本机构建 + 单元测试 + 脚本静态检查 ----------
  build-test:
    name: 构建与测试（x86_64）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-src, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: cargo build --release
        run: cargo build --release --locked

      - name: cargo test
        run: cargo test --locked

      - name: cargo fmt 检查（仅提示）
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: 静态检查（shell / JSON）
        run: ./scripts/ci-checks.sh

  # ---------- 2) 交叉编译 + OpenWrt 打包（含 mipsel_24kc 软浮点） ----------
  openwrt:
    name: OpenWrt 打包（${{ matrix.ipk_arch }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - triple: x86_64-unknown-linux-musl
            ipk_arch: x86_64
            apk_arch: x86_64
          - triple: aarch64-unknown-linux-musl
            ipk_arch: aarch64_cortex-a53
            apk_arch: aarch64_cortex-a53
          - triple: mipsel-unknown-linux-musl
            ipk_arch: mipsel_24kc
            apk_arch: mipsel_24kc
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust（含 rust-src，用于 build-std）
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-src

      - uses: Swatinem/rust-cache@v2
        with:
          key: cross-${{ matrix.triple }}

      - name: 安装 aarch64 交叉链接器
        if: matrix.triple == 'aarch64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu

      - name: 交叉编译 + 打包 .ipk / .apk
        env:
          CI_SKIP_PUBLISH: "1"
        run: |
          ./scripts/ci-build-package.sh \
            "${{ matrix.triple }}" "${{ matrix.ipk_arch }}" "${{ matrix.apk_arch }}"
          file packaging/openwrt/staging/autheap

      - name: 上传 OpenWrt 包
        uses: actions/upload-artifact@v4
        with:
          name: autheap-openwrt-${{ matrix.ipk_arch }}
          if-no-files-found: error
          path: |
            packaging/openwrt/staging/*.ipk
            packaging/openwrt/staging/*.apk

  # ---------- 3) LuCI 界面包（架构 all）+ 桌面 .deb ----------
  luci-desktop:
    name: LuCI 包 + 桌面 deb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: 构建 LuCI .ipk / .apk
        run: |
          set -e
          VERSION="$(./scripts/ci-version.sh)"
          ./packaging/openwrt/scripts/build-luci.sh "$VERSION" 1

      - name: 构建桌面 .deb
        run: |
          set -e
          VERSION="$(./scripts/ci-version.sh)"
          VERSION="$VERSION" ./packaging/desktop/build-deb.sh

      - name: 上传 LuCI 包
        uses: actions/upload-artifact@v4
        with:
          name: autheap-luci
          if-no-files-found: error
          path: |
            packaging/openwrt/staging/luci-app-autheap-client_*.ipk
            packaging/openwrt/staging/luci-app-autheap-client-*.apk

      - name: 上传桌面 deb
        uses: actions/upload-artifact@v4
        with:
          name: autheap-desktop-deb
          if-no-files-found: error
          path: packaging/desktop/out/*.deb
