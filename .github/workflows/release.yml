name: Release

on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:
    inputs:
      bump:
        description: '版本号递增级别（patch / minor / major）'
        default: patch

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # CI 的版本由 version job / ci-version.sh 统一决定，构建脚本不要再自动 +1。
  AUTHEAP_NO_VERSION_BUMP: "1"

jobs:
  # ---------- 计算版本号（tag 事件用 tag；手动触发则对最大版本 +1）----------
  version:
    name: 计算版本号
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calc.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: 计算版本号
        id: calc
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUMP_LEVEL: ${{ inputs.bump }}
        run: |
          V="$(./scripts/ci-version.sh)"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "本次版本号: $V"

  # ---------- 交叉编译 + OpenWrt 包 ----------
  openwrt:
    name: OpenWrt 包（${{ matrix.ipk_arch }}）
    runs-on: ubuntu-latest
    needs: [ version ]
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - triple: x86_64-unknown-linux-musl
            ipk_arch: x86_64
            apk_arch: x86_64
            cross_deps: ''
          - triple: aarch64-unknown-linux-musl
            ipk_arch: aarch64_cortex-a53
            apk_arch: aarch64_cortex-a53
            cross_deps: gcc-aarch64-linux-gnu
          - triple: armv7-unknown-linux-musleabihf
            ipk_arch: arm_cortex-a7_neon-vfpv4
            apk_arch: arm_cortex-a7_neon-vfpv4
            cross_deps: gcc-arm-linux-gnueabihf
          - triple: arm-unknown-linux-musleabihf
            ipk_arch: arm_arm1176jzf-s_vfp
            apk_arch: arm_arm1176jzf-s_vfp
            cross_deps: gcc-arm-linux-gnueabihf
          - triple: riscv64gc-unknown-linux-musl
            ipk_arch: riscv64_riscv64
            apk_arch: riscv64_riscv64
            cross_deps: gcc-riscv64-linux-gnu
          - triple: mipsel-unknown-linux-musl
            ipk_arch: mipsel_24kc
            apk_arch: mipsel_24kc
            cross_deps: ''
          - triple: mips-unknown-linux-musl
            ipk_arch: mips_24kc
            apk_arch: mips_24kc
            cross_deps: ''
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust（含 rust-src，用于 build-std）
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-src

      - uses: Swatinem/rust-cache@v2
        with:
          key: cross-${{ matrix.triple }}

      - name: 安装交叉链接器
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends file curl
          DEPS="${{ matrix.cross_deps }}"
          if [ -n "$DEPS" ]; then
            sudo apt-get install -y --no-install-recommends $DEPS
          fi

      - name: 交叉编译 + 打包 .ipk / .apk
        env:
          CI_SKIP_PUBLISH: "1"
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ./scripts/ci-build-package.sh \
            "${{ matrix.triple }}" "${{ matrix.ipk_arch }}" "${{ matrix.apk_arch }}"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: rel-openwrt-${{ matrix.ipk_arch }}
          if-no-files-found: error
          path: |
            packaging/openwrt/staging/*.ipk
            packaging/openwrt/staging/*.apk

  # ---------- LuCI 界面包 ----------
  luci:
    name: LuCI 包
    runs-on: ubuntu-latest
    needs: [ version ]
    steps:
      - uses: actions/checkout@v4
      - name: 构建 LuCI .ipk / .apk
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: ./packaging/openwrt/scripts/build-luci.sh "$VERSION" 1
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: rel-luci
          if-no-files-found: error
          path: |
            packaging/openwrt/staging/luci-app-autheap-client_*.ipk
            packaging/openwrt/staging/luci-app-autheap-client-*.apk

  # ---------- 桌面 .deb ----------
  desktop:
    name: 桌面 deb
    runs-on: ubuntu-latest
    needs: [ version ]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 构建 .deb
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: ./packaging/desktop/build-deb.sh
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: rel-desktop
          if-no-files-found: error
          path: packaging/desktop/out/*.deb

  # ---------- 发布 ----------
  publish:
    name: 创建 GitHub Release
    needs: [ version, openwrt, luci, desktop ]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 收集全部安装包
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 列出产物
        run: ls -l dist

      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.version }}
          name: ${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: dist/*
